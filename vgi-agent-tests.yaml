tasks:
  - name: stations_query
    reference_sql: "SELECT station_id, name FROM tides.main.stations() ORDER BY station_id LIMIT 5"
  - name: tide_predictions_query
    reference_sql: "SELECT time, height_m FROM tides.main.tide_predictions('8518750', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: water_levels_query
    reference_sql: "SELECT time, height_m FROM tides.main.water_levels('8518750', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: current_predictions_query
    reference_sql: "SELECT time, velocity_major_mps FROM tides.main.current_predictions('ACT0956', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: currents_query
    reference_sql: "SELECT time, speed_mps FROM tides.main.currents('cb0102', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: current_bins_query
    reference_sql: "SELECT bin, depth_m FROM tides.main.current_bins('cb0102') ORDER BY bin"
  - name: reference_units
    reference_sql: "SELECT sql_function, output_units FROM tides.main.products WHERE output_units = 'm/s' ORDER BY sql_function"
  - name: composed_battery_peak_residual
    check_sql: "WITH r AS (SELECT o.time, o.height_m - p.height_m AS residual_m FROM tides.main.water_levels('8518750', '2026-01-08', '2026-01-14') AS o JOIN tides.main.tide_predictions('8518750', '2026-01-08', '2026-01-14', step := '6') AS p USING (time)), m AS (SELECT max(residual_m) AS peak FROM r) SELECT count(*) = 1 AND coalesce(bool_and(abs(a.residual_m - m.peak) < 0.005 AND a.time IN (SELECT time FROM r WHERE residual_m > m.peak - 0.0005)), false) FROM battery_peak_residual AS a, m"
  - name: composed_cape_henry_slowest_depth
    check_sql: "SELECT count(*) = 1 AND coalesce(bool_and(abs(a.depth_m - r.depth_m) < 0.001 AND abs(a.mean_speed_mps - r.mean_speed_mps) < 0.005), false) FROM slowest_depth AS a, (SELECT b.depth_m, avg(c.speed_mps) AS mean_speed_mps FROM tides.main.currents('cb0102', '2026-01-02', '2026-01-03') AS c JOIN tides.main.current_bins('cb0102') AS b USING (bin) GROUP BY b.depth_m ORDER BY mean_speed_mps LIMIT 1) AS r"
