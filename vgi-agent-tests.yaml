tasks:
  - name: stations_query
    reference_sql: "SELECT station_id, name FROM tides.main.stations() ORDER BY station_id LIMIT 5"
  - name: tide_predictions_query
    reference_sql: "SELECT time, height_m FROM tides.main.tide_predictions('8518750', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: water_levels_query
    reference_sql: "SELECT time, height_m FROM tides.main.water_levels('8518750', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: current_predictions_query
    reference_sql: "SELECT time, velocity_major_mps FROM tides.main.current_predictions('ACT0956', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: currents_query
    reference_sql: "SELECT time, speed_mps FROM tides.main.currents('cb0102', '2026-01-01', '2026-01-02') ORDER BY time"
  - name: current_bins_query
    reference_sql: "SELECT bin, depth_m FROM tides.main.current_bins('cb0102') ORDER BY bin"
  - name: reference_units
    reference_sql: "SELECT sql_function, output_units FROM tides.main.products WHERE output_units = 'm/s' ORDER BY sql_function"
